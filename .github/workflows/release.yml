name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without leading v
        required: true
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: ${{ matrix.name }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            triplet: x64-linux
            package_suffix: linux-x64
            archive_extension: tar.gz
          - name: macOS
            os: macos-latest
            triplet: arm64-osx
            package_suffix: macos-arm64
            archive_extension: zip
          - name: Windows
            os: windows-latest
            triplet: x64-windows
            package_suffix: windows-x64
            archive_extension: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Version must look like 0.1.0, without a leading v."
            exit 1
          fi
          if [[ "$(tr -d '[:space:]' < VERSION)" != "$version" ]]; then
            echo "workflow_dispatch version '$version' does not match VERSION file:"
            cat VERSION
            exit 1
          fi

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          autoconf
          autoconf-archive
          automake
          gcc-14
          g++-14
          libasound2-dev
          libegl1-mesa-dev
          libltdl-dev
          libtool
          libwayland-dev
          libx11-dev
          libxcb-xinput-dev
          libxcursor-dev
          libxext-dev
          libxft-dev
          libxi-dev
          libxkbcommon-dev
          libxrandr-dev
          libxtst-dev

      - name: Select Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" pull --ff-only
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Install vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/.git")) {
            Remove-Item -Recurse -Force "$env:VCPKG_ROOT" -ErrorAction SilentlyContinue
            git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          } else {
            git -C "$env:VCPKG_ROOT" pull --ff-only
          }
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          package_name="auric-${version}-${{ matrix.package_suffix }}"
          package_dir="dist/${package_name}"
          cmake --install build --config Release --prefix "$package_dir" --strip
          ldd "$package_dir/bin/auric"
          tar -czf "dist/${package_name}.tar.gz" -C dist "$package_name"
          tar -tzf "dist/${package_name}.tar.gz"

      - name: Stage macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          package_name="auric-${version}-${{ matrix.package_suffix }}"
          package_dir="dist/${package_name}"
          cmake --install build --config Release --prefix "$package_dir" --strip
          file "$package_dir/bin/auric"
          otool -L "$package_dir/bin/auric"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "dist/${package_name}.zip"
          unzip -l "dist/${package_name}.zip"

      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $packageName = "auric-$version-${{ matrix.package_suffix }}"
          $packageDir = Join-Path "dist" $packageName
          cmake --install build --config Release --prefix $packageDir

          $vcpkgBin = Join-Path "build/vcpkg_installed/${{ matrix.triplet }}" "bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item (Join-Path $vcpkgBin "*.dll") (Join-Path $packageDir "bin") -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path "$packageDir/bin/auric.exe")) {
            throw "The staged Windows executable was not found"
          }
          Get-ChildItem -Recurse $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/$packageName.zip"
          $checkDir = Join-Path "dist" "archive-check"
          Expand-Archive -Path "dist/$packageName.zip" -DestinationPath $checkDir -Force
          Get-ChildItem -Recurse $checkDir
          if (-not (Test-Path (Join-Path $checkDir "$packageName/bin/auric.exe"))) {
            throw "The Windows archive does not contain the expected executable"
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: auric-${{ inputs.version }}-${{ matrix.package_suffix }}
          path: dist/auric-${{ inputs.version }}-${{ matrix.package_suffix }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: auric-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="v${version}"
          release_flags=()
          if [[ "${{ inputs.draft }}" == "true" ]]; then
            release_flags+=(--draft)
          fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sort)
          if [[ "${#archives[@]}" -ne 3 ]]; then
            echo "Expected three release archives, found ${#archives[@]}"
            find dist -maxdepth 2 -type f -print
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${archives[@]}" --clobber
          else
            gh release create "$tag" "${archives[@]}" \
              --title "Auric ${tag}" \
              --notes "Portable Linux x64, Windows x64, and macOS arm64 packages for Auric ${tag}." \
              "${release_flags[@]}"
          fi
